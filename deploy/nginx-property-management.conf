# PropertyManagement, served entirely from one hostname:
#   /            -> the built frontend (dist/)
#   /rest/v1/    -> PostgREST
#   /auth/v1/    -> GoTrue
#
# One host rather than the site-plus-api-subdomain split FarmHand uses,
# because it makes every request from the app same-origin. That isn't a
# cosmetic difference: it removes CORS from the picture completely. No
# preflights, no Access-Control-* headers to get subtly wrong, and none of
# the duplicated-header failure mode documented at length in
# selfhost/nginx-property-management-api.conf — a class of bug that
# presents as "the server clearly worked but the browser says it couldn't
# reach it". The cheapest way to not have that bug is to not need the
# headers.
#
# One-time setup on the VPS:
#   sudo cp deploy/nginx-property-management.conf /etc/nginx/sites-available/property-management
#   sudo ln -s /etc/nginx/sites-available/property-management /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d properties.farmhandmanager.com
#
# certbot rewrites this file in place to add the certificate and an
# http -> https redirect, so the block below is deliberately http-only.
# After any certbot run, check that the location blocks below survived —
# that has bitten this VPS before (see FarmHand's api conf header).

server {
    listen 80;
    listen [::]:80;
    server_name properties.farmhandmanager.com;

    root /home/ubuntu/PropertyManagement/dist;
    index index.html;

    # PostgREST expects its own root ("/properties"), not "/rest/v1/properties")
    # — the /rest/v1 prefix is a Supabase-client convention it knows nothing
    # about. Longer prefix than `location /`, so nginx matches this first.
    location /rest/v1/ {
        rewrite ^/rest/v1/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Same story for GoTrue: its routes are /token, /signup, /recover.
    location /auth/v1/ {
        rewrite ^/auth/v1/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:9998;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Fail fast rather than hang: GoTrue sends mail synchronously inside
        # /recover and /signup, so an unreachable SMTP host becomes a request
        # that never answers. A 504 at 15s is diagnosable; a hang is not.
        proxy_connect_timeout 10s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
    }

    # Confirmation and password-reset emails link here directly, not to
    # /auth/v1/verify — GoTrue builds that URL from API_EXTERNAL_URL, which
    # has no idea the /auth/v1 prefix exists. Without this block every
    # confirmation email 404s and signup breaks completely.
    location = /verify {
        proxy_pass http://127.0.0.1:9998;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
    }

    # Vite fingerprints these filenames, so they're safe to cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must NOT be cached, or a deploy leaves browsers holding a
    # stale page pointing at asset files that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # The app's router uses real URLs via pushState, so /login and
    # /dashboard have to serve index.html rather than 404 — otherwise they
    # work in-app but break on refresh or when opened from a link.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
