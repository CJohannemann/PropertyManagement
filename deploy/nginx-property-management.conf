# Serves the built PropertyManagement frontend (static files from dist/).
#
# Separate from deploy/selfhost/nginx-property-management-api.conf, which
# serves the API on 8090 — this is the site itself, on 8080. Two ports
# rather than one because the API config's /rest/v1 and /auth/v1 locations
# would otherwise have to coexist with a catch-all `location /` here, and
# keeping them apart means changing one can't accidentally break the other.
#
# TEMPORARY: bare IP over plain HTTP, no TLS, matching the API's current
# setup — see deploy/selfhost/README.md's "Moving to a real domain later",
# which covers this file too.
#
# One-time setup on the VPS:
#   sudo cp deploy/nginx-property-management.conf /etc/nginx/sites-available/property-management
#   sudo ln -s /etc/nginx/sites-available/property-management /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /home/ubuntu/PropertyManagement/dist;
    index index.html;

    # The app's router (src/lib/route.ts) uses real URLs via pushState, so
    # /login and /dashboard must serve index.html rather than 404 — without
    # this, those paths work when navigated to in-app but break on refresh
    # or when opened directly from a link.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite fingerprints filenames in dist/assets (index-a1b2c3d4.js), so
    # those are safe to cache hard; index.html itself must not be, or a
    # deploy leaves browsers holding a stale page that points at
    # already-deleted asset files.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
