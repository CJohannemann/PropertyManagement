# PropertyManagement's self-hosted backend (PostgREST + GoTrue), fronted
# here the same way FarmHand's is — see that repo's
# deploy/selfhost/nginx-farmhand-api.conf for the full reasoning behind
# every choice below (path rewriting, why CORS headers live only in the
# OPTIONS branch, the double-header bug history). This file only calls out
# what's actually different.
#
# TEMPORARY: listens on a bare port (8090) over plain HTTP instead of a
# domain + certbot TLS, because no domain is bought yet. This is a solo
# dev/testing setup only — see README.md's "Moving to a real domain later"
# for the (small) migration once one exists. Port 8090 was picked
# specifically so this never needs `server_name` matching against
# FarmHand's or IBC's existing port-80 vhosts on this same box — it's a
# wholly separate listener, no collision possible.
#
# One-time setup on the VPS:
#   sudo cp deploy/selfhost/nginx-property-management-api.conf /etc/nginx/sites-available/property-management-api
#   sudo cp deploy/selfhost/nginx-property-management-cors.conf /etc/nginx/conf.d/property-management-cors.conf
#   sudo ln -s /etc/nginx/sites-available/property-management-api /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# No certbot step — see the TEMPORARY note above.

server {
    listen 8090;
    listen [::]:8090;
    server_name _;

    # PostgREST expects its own root ("/properties"), not
    # "/rest/v1/properties") — the /rest/v1 prefix is a Supabase-client
    # convention, not something PostgREST itself knows about.
    location /rest/v1/ {
        # No add_header here for the proxied (non-OPTIONS) path — PostgREST
        # already sends its own complete CORS headers on every response.
        # See nginx-farmhand-api.conf's header for why a second copy here
        # is a bug (duplicated CORS headers make Safari/Chrome reject an
        # otherwise-successful response as a bare network failure).
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $cors_origin;
            add_header Access-Control-Allow-Methods "GET, POST, PATCH, DELETE, PUT, OPTIONS, HEAD";
            add_header Access-Control-Allow-Headers "authorization, apikey, content-type, accept-profile, content-profile, prefer, x-client-info, x-supabase-api-version, range";
            add_header Access-Control-Max-Age 3600;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }

        rewrite ^/rest/v1/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # The link in a confirmation or password-reset email points here
    # directly, not /auth/v1/verify — GoTrue builds that link from
    # API_EXTERNAL_URL (see docker-compose.yml), which has no idea the
    # /auth/v1 prefix even exists. Not exercised yet while
    # GOTRUE_MAILER_AUTOCONFIRM is "true", but wired up now so flipping
    # that off later doesn't also require an nginx change.
    location = /verify {
        proxy_pass http://127.0.0.1:9998;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
    }

    # GoTrue's routes are /token, /signup, /recover, etc, not
    # /auth/v1/token.
    location /auth/v1/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $cors_origin;
            add_header Access-Control-Allow-Methods "GET, POST, PATCH, DELETE, PUT, OPTIONS, HEAD";
            add_header Access-Control-Allow-Headers "authorization, apikey, content-type, accept-profile, content-profile, prefer, x-client-info, x-supabase-api-version, range";
            add_header Access-Control-Max-Age 3600;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }

        rewrite ^/auth/v1/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:9998;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Fail fast rather than hang. GoTrue sends mail synchronously inside
        # /recover and /signup, so an SMTP host it cannot reach becomes a
        # request that never answers.
        proxy_connect_timeout 10s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
    }
}
