# Which browser origins the PropertyManagement API answers CORS preflights
# for.
#
# One-time setup on the VPS:
#   sudo cp deploy/selfhost/nginx-property-management-cors.conf /etc/nginx/conf.d/property-management-cors.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Lives in conf.d/ rather than inside nginx-property-management-api.conf
# for the same reason as FarmHand's equivalent file: `map` is only valid at
# the http level, not inside a `server` block. conf.d/*.conf loads ahead of
# sites-enabled/* in Ubuntu's stock nginx.conf, so $cors_origin is defined
# by the time the server block below references it.
#
# TEMPORARY and deliberately permissive (reflects whatever Origin the
# browser sent) rather than a real allowlist like FarmHand's — there's no
# fixed frontend origin yet (still localhost dev), and no real tenant data
# flowing through this yet either. Replace this whole file with a strict
# map (see FarmHand's nginx-farmhand-cors.conf for the pattern — apex +
# www each need their own line, a plain `set` can't hold both) once a real
# domain exists and this stops being solo local-dev traffic only.
#
# Only the OPTIONS preflight in nginx-property-management-api.conf uses
# this; PostgREST and GoTrue send their own CORS headers on real responses
# — see that file's header before adding a second copy anywhere, it has a
# real bug history behind that warning.
map $http_origin $cors_origin {
    default $http_origin;
}
