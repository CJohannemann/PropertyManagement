# Self-hosted backend for PropertyManagement: Postgres, its REST API, and
# Auth — same trimmed three-piece stack as FarmHand's deploy/selfhost on
# this same VPS (no Realtime, Storage, Studio, or Kong). See that repo's
# docker-compose.yml for the fuller reasoning; this file only calls out
# what's different here.
#
# `name:` below pins the Docker Compose project name explicitly. Without
# it, Compose derives the project name from the containing directory —
# which is "selfhost" in BOTH this repo and FarmHand's, since both keep
# this file at deploy/selfhost/docker-compose.yml. Left to that default,
# this stack's containers/network would collide with FarmHand's
# already-running "selfhost" project on the same Docker host.
name: property-management

# TEMPORARY: no domain purchased yet, so this stack is reached over the
# VPS's bare IP (15.204.120.16) on its own port, plain HTTP, instead of a
# domain + certbot TLS like FarmHand. See nginx-property-management-api.conf
# and README.md for the migration path once a domain exists — it's a
# config change, not a rebuild.
#
# Ports intentionally avoid FarmHand's on this box (5432, 8001, 9999).
services:
  db:
    image: supabase/postgres:15.1.1.78
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP: 3600
    volumes:
      - ./data/db:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"

  rest:
    image: postgrest/postgrest:v12.2.3
    restart: unless-stopped
    depends_on:
      - db
    environment:
      # See FarmHand's docker-compose.yml for why HOME must be set here.
      HOME: /tmp
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
    ports:
      - "127.0.0.1:8002:3000"

  auth:
    image: supabase/gotrue:v2.170.0
    restart: unless-stopped
    depends_on:
      - db
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      # Bare IP:port, not a domain — see the TEMPORARY note above.
      API_EXTERNAL_URL: http://${API_HOST}:${API_PORT}
      # Placeholder until the frontend actually exists somewhere; update
      # both this and GOTRUE_URI_ALLOW_LIST once it does (see README.md).
      GOTRUE_SITE_URL: ${FRONTEND_DEV_URL}
      GOTRUE_URI_ALLOW_LIST: ${FRONTEND_DEV_URL}/**,http://${API_HOST}:${API_PORT}/**
      GOTRUE_DB_DRIVER: postgres
      DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: 3600
      # See FarmHand's docker-compose.yml — this is what actually sets a
      # new user's JWT "role" claim, despite the deprecation notice.
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      # TEMPORARY, unlike FarmHand's (which is "false" now that it's
      # public-facing): true here because there's no frontend /verify page
      # yet for a confirmation link to land on, and this is Chris-only
      # testing so far, not a public signup page. Flip to "false" before
      # any real tenant/technician/PM invite goes out — an unconfirmed
      # signup on a rent-payment app is not something to leave open.
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_SMTP_HOST: ${SMTP_HOST}
      GOTRUE_SMTP_PORT: ${SMTP_PORT}
      GOTRUE_SMTP_USER: ${SMTP_USER}
      GOTRUE_SMTP_PASS: ${SMTP_PASS}
      GOTRUE_SMTP_SENDER_NAME: Property Management
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL}
    ports:
      - "127.0.0.1:9998:9999"
