# Self-hosted backend for PropertyManagement: Postgres, its REST API, and
# Auth — same trimmed three-piece stack as FarmHand's deploy/selfhost on
# this same VPS (no Realtime, Storage, Studio, or Kong). See that repo's
# docker-compose.yml for the fuller reasoning; this file only calls out
# what's different here.
#
# `name:` below pins the Docker Compose project name explicitly. Without
# it, Compose derives the project name from the containing directory —
# which is "selfhost" in BOTH this repo and FarmHand's, since both keep
# this file at deploy/selfhost/docker-compose.yml. Left to that default,
# this stack's containers/network would collide with FarmHand's
# already-running "selfhost" project on the same Docker host.
name: property-management

# Reached at https://properties.farmhandmanager.com — nginx on the host
# terminates TLS and routes /rest/v1 and /auth/v1 in here, while serving
# the app itself from the same origin (deploy/nginx-property-management.conf).
#
# Nothing here is exposed publicly: every published port binds to
# 127.0.0.1, so these containers are reachable only from the VPS itself,
# with nginx the sole way in. Ports intentionally avoid FarmHand's on this
# box (5432, 8001, 9999).
services:
  db:
    image: supabase/postgres:15.1.1.78
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP: 3600
    volumes:
      - ./data/db:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"

  rest:
    image: postgrest/postgrest:v12.2.3
    restart: unless-stopped
    depends_on:
      - db
    environment:
      # See FarmHand's docker-compose.yml for why HOME must be set here.
      HOME: /tmp
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
    ports:
      - "127.0.0.1:8002:3000"

  # Receipt photos and lease documents. The supabase/postgres image already
  # ships the `storage` schema (buckets, objects), so this needs no
  # migration of ours — only the service that puts files on disk and
  # enforces access against those tables.
  #
  # FILE_SIZE_LIMIT is 15MB: a modern phone camera produces 3-8MB, and a
  # technician photographing a receipt in a dim basement should not have an
  # upload rejected for being a large picture.
  storage:
    image: supabase/storage-api:v1.11.13
    restart: unless-stopped
    depends_on:
      - db
      - rest
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      PGRST_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      # Storage asks PostgREST about the database rather than reaching for
      # it directly.
      POSTGREST_URL: http://rest:3000
      FILE_SIZE_LIMIT: 15728640
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: stub
      GLOBAL_S3_BUCKET: stub
      ENABLE_IMAGE_TRANSFORMATION: "false"
    volumes:
      # Files live on the host, not inside the container: the container is
      # disposable and every receipt would go with it otherwise. Back this
      # up alongside ./data/db — a receipt is a tax record.
      - ./data/storage:/var/lib/storage
    ports:
      - "127.0.0.1:5002:5000"

  auth:
    image: supabase/gotrue:v2.170.0
    restart: unless-stopped
    depends_on:
      - db
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      # One origin serves both the app and this API (see
      # deploy/nginx-property-management.conf), so all three of these are
      # the same URL. API_EXTERNAL_URL is also what GoTrue builds
      # confirmation and password-reset links from — pointing it anywhere
      # the user's browser can't reach silently breaks those emails.
      API_EXTERNAL_URL: ${APP_URL}
      GOTRUE_SITE_URL: ${APP_URL}
      GOTRUE_URI_ALLOW_LIST: ${APP_URL}/**
      GOTRUE_DB_DRIVER: postgres
      DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: 3600
      # See FarmHand's docker-compose.yml — this is what actually sets a
      # new user's JWT "role" claim, despite the deprecation notice.
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      # Accounts must confirm their email address. This needs the SMTP_*
      # values below to be real: with autoconfirm off and mail broken,
      # nobody can complete a signup at all. The confirmation link points
      # at the bare /verify path, which needs the `location = /verify`
      # block in deploy/nginx-property-management.conf — without it every
      # confirmation email 404s.
      #
      # Note this is not the main thing stopping strangers from using this
      # server: a confirmed email is easy to come by. Organization
      # creation is gated separately, in the database, by
      # db/migrations/003_restrict_org_creation.sql.
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_SMTP_HOST: ${SMTP_HOST}
      GOTRUE_SMTP_PORT: ${SMTP_PORT}
      GOTRUE_SMTP_USER: ${SMTP_USER}
      GOTRUE_SMTP_PASS: ${SMTP_PASS}
      GOTRUE_SMTP_SENDER_NAME: Property Management
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL}
    ports:
      - "127.0.0.1:9998:9999"
